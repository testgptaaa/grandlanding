<!DOCTYPE html>
<html lang="ru" class="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grandma's Tomatoes | Agro-Tech v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Manrope:wght@200;400;600;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Manrope"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              dark: {
                900: '#0a0a0a',
                800: '#121212',
                700: '#1e1e1e',
              },
              tomato: {
                400: '#fb7185',
                500: '#f43f5e',
                600: '#e11d48', // Main accent
                glow: '#ff4d6d',
              },
              tech: {
                green: '#00ff94',
                blue: '#00d4ff',
              }
            },
            backgroundImage: {
              'grid-pattern': "linear-gradient(to right, #262626 1px, transparent 1px), linear-gradient(to bottom, #262626 1px, transparent 1px)",
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0a0a0a;
        color: #ededed;
      }
      .bg-grid {
        background-size: 40px 40px;
      }
      .glass-panel {
        background: rgba(30, 30, 30, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .neon-text {
        text-shadow: 0 0 20px rgba(225, 29, 72, 0.5);
      }
    </style>
